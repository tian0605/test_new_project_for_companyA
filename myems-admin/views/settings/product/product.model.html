<div class="inmodal">
    <div class="modal-header">
        <h4 class="modal-title">{{operation | translate}}(ID:{{product.id}})</h4>
    </div>
    <div class="modal-body">
        <form role="form" name="form_product" novalidate class="form-horizontal">
            <div class="form-group"><label class="col-sm-3 control-label">{{'SETTING.NAME' | translate}}<span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <input ng-model="product.name" type="text" name="name" class="form-control" title="product-name" required="">
                    <div class="m-t-xs" ng-show="form_product.name.$invalid && form_product.name.$dirty">
                        <small class="text-danger" ng-show="form_product.name.$error.required">{{'SETTING.INPUT_NAME' | translate}}</small>
                    </div>
                </div>
            </div>
            <div class="hr-line-dashed"></div>
            <div class="form-group"><label class="col-sm-3 control-label">{{'SETTING.UNIT_OF_MEASURE' | translate}}<span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <input ng-model="product.unit_of_measure" type="text" name="unit_of_measure" class="form-control" title="product-unit-of-measure" required="">
                    <div class="m-t-xs" ng-show="form_product.unit_of_measure.$invalid && form_product.unit_of_measure.$dirty">
                        <small class="text-danger" ng-show="form_product.unit_of_measure.$error.required">{{'SETTING.INPUT_UNIT_OF_MEASURE' | translate}}</small>
                    </div>
                </div>
            </div>
            <div class="form-group"><label class="col-sm-3 control-label">{{'SETTING.TAG' | translate}} ({{'SETTING.OPTIONAL' | translate}})</label>
                <div class="col-sm-9">
                    <input ng-model="product.tag" type="text" name="tag" class="form-control" title="product-tag">
                </div>
            </div>
            <div class="form-group"><label class="col-sm-3 control-label">{{'SETTING.STANDARD_PRODUCT_COEFFICIENT' | translate}}<span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <input ng-model="product.standard_product_coefficient" type="number" min="0.000001" step="0.000001" name="standard_product_coefficient" class="form-control" title="product-standard-product-coefficient" required="">
                    <div class="m-t-xs" ng-show="form_product.standard_product_coefficient.$invalid && form_product.standard_product_coefficient.$dirty">
                        <small class="text-danger" ng-show="form_product.standard_product_coefficient.$error.required">{{'SETTING.INPUT_STANDARD_PRODUCT_COEFFICIENT' | translate}}</small>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-white" ng-click="cancel()">{{'SETTING.CANCEL' | translate}}</button>
        <button type="button" ng-disabled="form_product.$invalid" class="btn btn-primary" ng-click="ok()">{{'SETTING.SAVE' | translate}}</button>
    </div>
</div>
